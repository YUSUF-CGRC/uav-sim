# ÖRNEK: Kendi preflight projende simülasyon için ayrı bir yapılandırma dosyası.
# Gerçek config.toml dosyanı kopyala, sadece aşağıdaki farklı değerleri değiştir.
# Anahtar adları sadece öneri; kendi tasarımına göre değiştir.
# Kendi bilgisayarındaki doğru yolları görmek için:  uav-sim paths

[connection]
port = "udpin:0.0.0.0:14560"   # gerçek Pi'de "/dev/ttyAMA0"
baud = 921600                  # UDP'de kullanılmaz ama zararı yok

[pi_system]
# Gerçek Pi'de: "/sys/class/thermal/thermal_zone0/temp" ve ["vcgencmd", "get_throttled"]
thermal_path = "C:/Users/KULLANICI/.uav-sim/pi/thermal_zone0/temp"
throttled_cmd = ["uav-sim", "vcgencmd", "get_throttled"]
